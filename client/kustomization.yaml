apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cap-lab

# Describe how to build the ConfigMap from our tracked Ruby file.
configMapGenerator:
  - name: service-client-tools
    files:
      # ConfigMap key = source file relative to this directory.
      - ask.rb=ask.rb

generatorOptions:
  # Keep the exact name referenced by our existing Deployment.
  disableNameSuffixHash: true
